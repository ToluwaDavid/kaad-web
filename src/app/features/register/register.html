<main class="relative min-h-screen flex item-center justify-center overflow-hidden bg-white px-4">
    <div class="pointer-events-non absolute -top-32 -left-24 h-96 w-96 rounded-full bg-blue-500/15 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-orange-400/15 blur-3xl"></div>

    <div class="relative z-10 w-full max-w-sm p-8">
        <div class="mb-8 text-center">
            <span class="text-3xl  tracking-tight text-gray-900" >kaad<span class="text-orange-500">.</span></span>
        </div>

        <h1 class="text-2xl tracking-tight text-gray-900">Create your account</h1>
        <p class="mt-1 text-sm text-gray-500">Two minutes to a shareable business card.</p>

        <form (submit)="onSubmit(); $event.preventDefault()" class="mt-8 space-y-4">
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
                <input id="email" type="email" placeholder="you@company.com" [value]="email()" (input)="email.set(($event.target).value)" class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:outline-none focus:border-blue-600 focus:ring-blue-600/15 transition "  />
            </div>
        </form>
    </div>
</main>
